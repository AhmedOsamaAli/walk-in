<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Walk-in: footsteps walk to a door that swings open on a lit room">
  <style>
    .t-word { font: 600 118px/1 Newsreader, Georgia, "Times New Roman", serif; letter-spacing: -3px; fill: #1d1d1f; }
    .t-line { font: italic 400 30px/1 Newsreader, Georgia, "Times New Roman", serif; fill: #474743; }
    .t-mono { font: 600 15px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 2.4px; fill: #0b59d0; }
    .step { fill: #1d1d1f; fill-opacity: .88; animation: step .45s cubic-bezier(.16,1,.3,1) backwards; }
    .shut { transform-box: fill-box; transform-origin: right center; transform: scaleX(0); animation: shut .5s cubic-bezier(.16,1,.3,1) 2.15s backwards; }
    .open { transform-box: fill-box; transform-origin: left center; animation: open .6s cubic-bezier(.16,1,.3,1) 2.55s backwards; }
    .spill { animation: fade .9s ease 2.7s backwards; }
    .rise { animation: rise .9s cubic-bezier(.16,1,.3,1) backwards; }
    .walk { stroke-dasharray: 6 7; animation: fade 1.2s ease .1s backwards; }
    @keyframes step { from { opacity: 0; transform: translateX(-2px); } }
    @keyframes shut { from { transform: none; } }
    @keyframes open { from { transform: scaleX(0); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="rgba(29,29,31,.045)" stroke-width="1"/>
    </pattern>
    <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcb00" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffcb00" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" fill="#f5f4ef"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <g transform="translate(250 30)">
    <path class="walk" d="M-110 210 L-84 178 L-34 168 L-12 124 L34 108 L72 70 L120 82 L160 60 L198 100 L240 98 L270 142 L258 196 L284 236 L244 282 L190 290 L156 322 L92 312 L42 328 L-12 298 L-66 292 L-102 260 Z" fill="rgba(15,104,234,.06)" stroke="#0f68ea" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <g transform="translate(225 25) scale(8)">
    <polygon class="spill" points="22.5,33.5 32.5,33.5 36,41 19,41" fill="url(#spill)"/>
    <path d="M20.5 33.5H40" fill="none" stroke="#1d1d1f" stroke-width="1.4" stroke-linecap="round"/>
      <g class="step" style="animation-delay:0.25s"><ellipse cx="-15.1" cy="30.9" rx="1.45" ry="1.1"/><circle cx="-17.8" cy="30.9" r=".8"/></g>
      <g class="step" style="animation-delay:0.45s"><ellipse cx="-10.7" cy="34.1" rx="1.45" ry="1.1"/><circle cx="-13.4" cy="34.1" r=".8"/></g>
      <g class="step" style="animation-delay:0.65s"><ellipse cx="-6.3" cy="30.9" rx="1.45" ry="1.1"/><circle cx="-9.0" cy="30.9" r=".8"/></g>
      <g class="step" style="animation-delay:0.85s"><ellipse cx="-1.9" cy="34.1" rx="1.45" ry="1.1"/><circle cx="-4.6" cy="34.1" r=".8"/></g>
      <g class="step" style="animation-delay:1.05s"><ellipse cx="2.5" cy="30.9" rx="1.45" ry="1.1"/><circle cx="-0.2" cy="30.9" r=".8"/></g>
      <g class="step" style="animation-delay:1.25s"><ellipse cx="6.9" cy="34.1" rx="1.45" ry="1.1"/><circle cx="4.2" cy="34.1" r=".8"/></g>
      <g class="step" style="animation-delay:1.45s"><ellipse cx="11.3" cy="30.9" rx="1.45" ry="1.1"/><circle cx="8.6" cy="30.9" r=".8"/></g>
      <g class="step" style="animation-delay:1.65s"><ellipse cx="15.7" cy="34.1" rx="1.45" ry="1.1"/><circle cx="13.0" cy="34.1" r=".8"/></g>
    <rect x="22.5" y="9.5" width="10" height="23" fill="#ffcb00"/>
    <g class="shut">
      <rect x="22.5" y="9.5" width="10" height="23" fill="#0f68ea"/>
      <rect x="24.6" y="11.6" width="5.8" height="8.4" rx=".6" fill="#ffffff" fill-opacity=".4"/>
      <circle cx="24.4" cy="22" r=".9" fill="#ffcb00"/>
    </g>
    <rect x="21.5" y="8.5" width="12" height="25" rx="1" fill="none" stroke="#1d1d1f" stroke-width="1.4"/>
    <g class="open">
      <polygon points="33.5,9.5 38.6,7.2 38.6,35.2 33.5,32.5" fill="#0f68ea"/>
      <polygon points="34.5,11.7 37.6,10.4 37.6,18.6 34.5,19.6" fill="#ffffff" fill-opacity=".4"/>
      <circle cx="37.7" cy="22.4" r=".8" fill="#ffcb00"/>
    </g>
  </g>
  <g class="rise" style="animation-delay:.35s">
    <text class="t-mono" x="600" y="128">QLOO TASTE DATA · REAL WALKING DISTANCE · EVIDENCE-CHECKED</text>
    <text class="t-word" x="594" y="246">Walk-in</text>
  </g>
  <g class="rise" style="animation-delay:.7s">
    <text class="t-line" x="600" y="300">Designs the business the neighborhood</text>
    <text class="t-line" x="600" y="340">would walk in for.</text>
  </g>
</svg>
