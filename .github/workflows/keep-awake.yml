name: Keep the demo awake

# The free Render instance sleeps after 15 idle minutes and takes about 40 seconds to wake (the Cloudflare front door
# shows a note meanwhile, and serves the surveyed storefronts' pages it keeps). Around the submission (Nov 12-14) and
# through judging (Dec 1-15, with a day's margin) a ping every 10 minutes keeps it awake; outside those windows it
# sleeps. While Render's 750 free hours a month must also keep another service awake, Founders sets no KEEP_AWAKE_URL
# (app/keepawake.py); this is its only pinger. Dates are UTC. Set the repository secret BACKEND_URL (the backend's own
# address, such as https://walk-in-founders.onrender.com); without it there is nothing to ping.
on:
  schedule:
    - cron: "*/10 * 12-14 11 *"  # submitted, Devpost's eligibility check
    - cron: "*/10 * 1-16 12 *"  # PayPal AI Hackathon judging, December 1-15
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health check
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::notice::The BACKEND_URL repository secret is not set, so there is nothing to ping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 90 --retry 2 "${BACKEND_URL%/}/api/health" > /dev/null
