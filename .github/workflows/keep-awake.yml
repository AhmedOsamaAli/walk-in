name: Keep the demo awake while judges test it

# The free Render instance sleeps after 15 idle minutes and takes about a minute to wake. During the two judging
# windows (dates in UTC) a ping every 10 minutes keeps it awake; outside them it sleeps, saving the account's 750 free
# hours a month. Scheduled runs are free for public repositories.
on:
  schedule:
    - cron: "*/10 * 2-16 11 *"  # Qloo hackathon judging, November 2-16
    - cron: "*/10 * 1-15 12 *"  # PayPal hackathon judging, December 1-15
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health check
        run: curl --fail --silent --show-error --max-time 90 --retry 2 https://walk-in-aoa2.onrender.com/api/health > /dev/null
