name: Settle Founders campaigns

# The app settles campaigns past their close every few minutes while it runs (and pays their owners), but a free
# Render instance sleeps when idle. This wakes it every 3 hours and runs one settlement pass; campaigns keep a 2-day
# margin before their first holds run out. Set the repository secrets BACKEND_URL (the backend's own address, such as
# https://walk-in-founders.onrender.com) and CRON_SECRET (the backend's CRON_SECRET).
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run one settlement pass
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::The BACKEND_URL and CRON_SECRET repository secrets are not both set, so there is nothing to call."
            exit 0
          fi
          # A sleeping instance takes about a minute to wake, so the first attempts may time out.
          curl --fail-with-body --silent --show-error --max-time 180 --retry 3 --retry-delay 30 --retry-all-errors \
            --request POST --header "X-Cron-Secret: $CRON_SECRET" \
            "${BACKEND_URL%/}/api/cron/settle"
