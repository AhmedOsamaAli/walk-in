# Alembic, for the command line. The app runs the same migrations on startup.
#   alembic upgrade head                        migrates DATABASE_URL (a SQLite file in .data/ by default)
#   alembic -x url=<database url> upgrade head  migrates another database
#   alembic revision --autogenerate -m "..."    drafts a migration from app/db/tables.py
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
