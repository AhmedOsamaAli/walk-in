services:
  - type: web
    name: blank-space
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: QLOO_API_KEY
        sync: false
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_MODEL
        value: gemini-3.6-flash
      - key: LLM_FALLBACK_MODELS
        value: gemini-3.5-flash,gemini-2.5-flash,gemini-3.1-flash-lite
      - key: LLM_REASONING_EFFORT
        value: low
      - key: LLM_TIMEOUT
        value: "45"
      - key: IMAGE_PROVIDER
        value: cloudflare,horde
      - key: IMAGE_DAILY_LIMIT
        value: "60"
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
