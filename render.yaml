services:
  - type: web
    name: walk-in
    runtime: docker
    plan: free
    # Ohio, next to the Neon database (AWS us-east-2), so each query stays a few milliseconds away.
    region: ohio
    healthCheckPath: /api/health
    envVars:
      - key: QLOO_API_KEY
        sync: false
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # The finished surveys anyone can open before running their own (comma-separated survey ids).
      - key: EXAMPLES
        sync: false
      # Shared with the Cloudflare Pages front door (frontend/functions), which sends the visitor's address with it.
      - key: PROXY_SECRET
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_MODEL
        value: gemini-3.6-flash
      - key: LLM_FALLBACK_MODELS
        value: gemini-3.5-flash,gemini-2.5-flash,gemini-3.1-flash-lite
      - key: LLM_REASONING_EFFORT
        value: low
      - key: LLM_TIMEOUT
        value: "45"
      - key: GROQ_API_KEY
        sync: false
