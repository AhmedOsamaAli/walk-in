services:
  - type: web
    name: blank-space
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: QLOO_API_KEY
        sync: false
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_MODEL
        value: gemini-3.8-flash
      - key: LLM_REASONING_EFFORT
        value: low
      - key: IMAGE_PROVIDER
        value: cloudflare
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
